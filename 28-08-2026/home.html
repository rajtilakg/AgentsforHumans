<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dermatology Clinic | Radiant Skin</title>
    <link rel="stylesheet" href="CSS/home.css">
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">DermaCare.</div>
        <div class="nav-links">
            <a href="#">Treatments</a>
            <a href="#" onclick="window.location.href='aboutus.html';">About Us</a>
            <a href="#contact" onclick="window.location.href='contactus/contactus.html';">Contact</a>
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Night/Day Mode">🌙</button>
        </div>
    </nav>

    <!-- Main Hero Section -->
    <header class="hero">
        <h1>Your Journey to Healthy Skin</h1>
        <p class="subtitle">Your skin type will receive individualized care from our AI dermatologist. Don't wait for an appointment to receive a customized treatment plan. </p>
        
        <div  class="cta-container">
            <!-- The specific button you requested -->
            <button type="button" onclick="window.location.href='backend\\qa-session.html';" id="qa-button" class="cta-button">I am ready</button>
            <div class="qa-text">Start with a Quick Q&A session ✨</div>
        </div>
    </header>

    <!-- Interactive JavaScript -->
<script>
        // Q&A Button Loading and Transition Effect
        const qaButton = document.getElementById('qa-button');

        qaButton.addEventListener('click', function(e) {
            e.preventDefault();

            let originalText = this.innerText;
            this.innerText = "Loading Q&A...";
            this.style.opacity = "0.8";

            setTimeout(() => {
                window.location.href = 'backend/qa-session.html';
            }, 500);
        });

        // Night / Day Mode Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // Check for saved user preference in localStorage
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            htmlElement.setAttribute('data-theme', 'dark');
            themeToggleBtn.innerText = '☀️';
        }

        themeToggleBtn.addEventListener('click', function() {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                this.innerText = '🌙';
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                this.innerText = '☀️';
            }
        });
    </script>

</body>
</html>
