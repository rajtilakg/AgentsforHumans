<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dermatology Clinic | Radiant Skin</title>
    <style>

        :root {
            --primary-color: #3b82f6; /* Modern blue */
            --primary-light: #eff6ff;
            --text-main: #1f2937; /* Dark gray for light mode text */
            --text-muted: #6b7280;
            --bg-color: #f8fafc; /* Very light slate for background */
            --nav-bg: #ffffff; /* White nav */
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --chat-bubble-user: #3b82f6;
            --chat-bubble-bot: #ffffff;
            --chat-border: #e2e8f0;
        }

        [data-theme="dark"] {
            --primary-color: #38bdf8; /* Lighter, glowing blue for dark mode */
            --primary-light: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bg-color: #0f172a; /* Deep slate background */
            --nav-bg: #1e293b; /* Slightly lighter slate for nav */
            --card-bg: #1e293b;
            --border-color: #334155;
            --chat-bubble-user: #38bdf8;
            --chat-bubble-bot: #1e293b;
            --chat-border: #334155;
        }

        

        

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            background-color: var(--bg-color);
            transition: background-color 0.3s, color 0.3s;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8vw;
            background: var(--nav-bg);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: fixed;
            width: 100%;
            top: 0;
            box-sizing: border-box;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            margin-left: 30px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }
        .theme-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 30px;
        }

        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            /* Update gradient logic for dark mode */
            background: linear-gradient(135deg, var(--bg-color) 0%, var(--primary-light) 100%);
            padding: 0 20px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseEffect {
            0% { box-shadow: 0 0 0 0 rgba(0, 131, 143, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(0, 131, 143, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 131, 143, 0); }
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: var(--text-main);
            animation: fadeUp 1s ease-out forwards;
        }

        .hero p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
            opacity: 0; 
            animation: fadeUp 1s ease-out 0.3s forwards;
        }

        .cta-container {
            opacity: 0; 
            animation: fadeUp 1s ease-out 0.6s forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cta-button {
            background-color: var(--primary-color);
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 600;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s;
            animation: pulseEffect 2s infinite; 
        }

        .cta-button:hover {
            transform: translateY(-3px) scale(1.05);
            background-color: #006064;
            animation: none; 
            box-shadow: 0 10px 20px rgba(0, 131, 143, 0.3);
        }

        .qa-text {
            margin-top: 15px;
            font-size: 0.95rem;
            color: var(--primary-color);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo" style="text-decoration: none;">DermaCare.</a>
        <div class="nav-links">
            <a href="/treatments.html">Treatments</a>
            <a href="/about.html">About Us</a>
            <a href="/login" style="font-weight: 700; color: var(--primary-color);">Login / Sign Up</a>
            <button onclick="toggleTheme()" class="theme-btn" title="Toggle Theme">🌓</button>
        </div>
    </nav>

    <header class="hero">
        <h1>Your Journey to Healthy Skin</h1>
        <p class="subtitle">Your skin type will receive individualized care from our AI dermatologist. Don't wait for an appointment to receive a customized treatment plan.</p>
        
        <div class="cta-container">
            <button type="button" onclick="window.location.href='/login';" id="qa-button" class="cta-button">I am ready</button>
            <div class="qa-text">Start with a Quick Q&A session ✨</div>
        </div>
    </header>

    <script>
        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
    </script>
<script>
        // Dynamic Auth Navigation & CTA Routing
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/auth-status');
                const data = await res.json();
                
                if (data.isAuthenticated) {
                    // 1. Swap Navbar Links
                    const loginLink = document.querySelector('a[href="/login"]');
                    if (loginLink) {
                        const navContainer = loginLink.parentElement;
                        
                        const chatLink = document.createElement('a');
                        chatLink.href = '/Main.html';
                        chatLink.textContent = 'Chat';
                        chatLink.style.fontWeight = '700';
                        chatLink.style.color = 'var(--primary-color)';
                        
                        const logoutLink = document.createElement('a');
                        logoutLink.href = '/logout';
                        logoutLink.textContent = 'Logout';
                        
                        // Insert new links and remove the old login link
                        navContainer.insertBefore(chatLink, loginLink);
                        navContainer.insertBefore(logoutLink, loginLink);
                        loginLink.remove();
                    }

                    // 2. Update Hero Button on home.html
                    const ctaBtn = document.getElementById('qa-button');
                    if (ctaBtn) {
                        ctaBtn.onclick = () => window.location.href = '/Main.html';
                        ctaBtn.textContent = 'Continue to Chat';
                        
                        const qaText = document.querySelector('.qa-text');
                        if (qaText) qaText.textContent = 'Jump back into your session ✨';
                    }
                    
                    // 3. Update CTA Links on about.html & treatments.html
                    const ctaLinks = document.querySelectorAll('.cta-button[href="/login"]');
                    ctaLinks.forEach(link => {
                        link.href = '/Main.html';
                        link.textContent = 'Continue to Chat';
                    });
                }
            } catch (err) {
                console.error("Auth check failed:", err);
            }
        });
    </script>
</body>
</html>
