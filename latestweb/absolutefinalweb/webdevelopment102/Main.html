<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Product | DermaCare</title>
    <style>
        :root {
            --primary-color: #00838f;
            --primary-light: #e0f7fa;
            --text-main: #333333;
            --text-muted: #666666;
            --bg-color: #f4f7f6;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8vw;
            background: #ffffff;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            margin-left: 25px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .nav-links a.active {
            color: var(--primary-color);
            font-weight: 700;
        }

        .page-content {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: center;
            padding: 40px 20px 80px;
        }

        /* --- Single unified card: search / upload / chat --- */
        .search-wrapper {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .subtitle {
            margin: 0 0 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            padding: 5px 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-bar:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 131, 143, 0.1);
        }

        input[type="text"] {
            border: none;
            outline: none;
            flex-grow: 1;
            font-size: 1.1rem;
            padding: 15px 10px;
            background: transparent;
        }

        input[type="text"]:disabled {
            color: var(--text-muted);
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 50%;
            transition: color 0.3s, background-color 0.3s;
        }

        .icon-btn:hover {
            color: var(--primary-color);
            background-color: rgba(0, 131, 143, 0.05);
        }

        .icon-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #camera-input {
            display: none;
        }

        /* --- Conversation area, inside the same card --- */
        #chat-log {
            margin-top: 25px;
            text-align: left;
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .msg {
            max-width: 85%;
            padding: 11px 15px;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 0.93rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            animation: fadeUp 0.25s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            align-self: flex-end;
            background: var(--primary-color);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .msg.typing {
            align-self: flex-start;
            background: var(--bg-color);
            border: 1px solid #e0e0e0;
            color: var(--text-muted);
            font-style: italic;
        }

        .msg.error {
            align-self: flex-start;
            background: #fdecea;
            color: #b3261e;
            border: 1px solid #f5c6c3;
        }

        /* Live Camera Modal Styles */
        #live-camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #live-video {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            border: 3px solid #ffffff;
        }

        .modal-controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .modal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
        }

        .modal-btn.close {
            background: #d32f2f;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo">DermaCare.</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/treatments.html">Treatments</a>
            <a href="/about.html">About Us</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="page-content">
        <div class="search-wrapper">
            <h2>Find Your Product</h2>
            <p class="subtitle">Search, snap a photo, or just ask — your AI dermatologist is right here.</p>

            <div class="search-bar">
                <!-- 1. Send / Search Button -->
                <button class="icon-btn" id="send-btn" onclick="sendMessage()" title="Send">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>

                <input type="text" id="chat-input" placeholder="Search by name, ingredient, brand — or ask a question..." autocomplete="off">

                <!-- 2. Snapshot Lens Button (Uploads/Snaps a photo file) -->
                <label for="camera-input" class="icon-btn" title="Search with Photo Lens">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </label>
                <input type="file" id="camera-input" accept="image/*" capture="environment">

                <!-- 3. Live Search Camera Button (Opens continuous video stream) -->
                <button class="icon-btn" id="live-search-btn" title="Live Camera Search" onclick="startLiveSearch()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 7l-7 5 7 5V7z"></path>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </button>
            </div>

            <!-- Conversation lives right here, inside the same card -->
            <div id="chat-log"></div>
        </div>
    </div>

    <!-- Live Camera Stream Overlay/Modal -->
    <div id="live-camera-modal">
        <video id="live-video" autoplay playsinline></video>
        <div class="modal-controls">
            <button class="modal-btn" onclick="captureLiveFrame()">Capture & Search</button>
            <button class="modal-btn close" onclick="stopLiveSearch()">Close Camera</button>
        </div>
    </div>

    <script>
        const chatInput = document.getElementById('chat-input');
        const cameraInput = document.getElementById('camera-input');
        const sendBtn = document.getElementById('send-btn');
        const chatLog = document.getElementById('chat-log');
        const liveModal = document.getElementById('live-camera-modal');
        const liveVideo = document.getElementById('live-video');
        let mediaStream = null;

        // Entire conversation lives in this JS variable only — plain browser
        // RAM, single session. A page refresh clears it; nothing is ever
        // written to localStorage/sessionStorage or a database.
        let history = [];

        function scrollChatToBottom() {
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            chatLog.appendChild(div);
            scrollChatToBottom();
            return div;
        }

        function setBusy(isBusy) {
            sendBtn.disabled = isBusy;
            chatInput.disabled = isBusy;
        }

        // ---------- Chat / Text Search (same input box) ----------
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            history.push({ role: 'user', text });
            chatInput.value = '';
            setBusy(true);

            const typingEl = appendMessage('typing', 'Thinking...');

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history }),
                });

                const data = await res.json();
                typingEl.remove();

                if (!res.ok || data.status !== 'success') {
                    appendMessage('error', data.message || 'Something went wrong. Please try again.');
                    setBusy(false);
                    chatInput.focus();
                    return;
                }

                appendMessage('bot', data.reply);
                history.push({ role: 'bot', text: data.reply });
            } catch (err) {
                console.error('Chat request failed:', err);
                typingEl.remove();
                appendMessage('error', 'Could not reach the server. Please check your connection and try again.');
            }

            setBusy(false);
            chatInput.focus();
        }

        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        // ---------- Photo Snapshot Lens (uploads to S3, unchanged) ----------
        if (cameraInput) {
            cameraInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    uploadImageToServer(file, file.name);
                }
            });
        }

        // ---------- Live Search Camera (unchanged) ----------
        async function startLiveSearch() {
            liveModal.style.display = 'flex';

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                liveVideo.srcObject = mediaStream;
            } catch (error) {
                console.error("Camera access denied or unavailable:", error);
                appendMessage('error', 'Could not access device camera.');
                stopLiveSearch();
            }
        }

        function captureLiveFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = liveVideo.videoWidth;
            canvas.height = liveVideo.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(liveVideo, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                stopLiveSearch();
                uploadImageToServer(blob, "live-snapshot.jpg");
            }, 'image/jpeg');
        }

        function stopLiveSearch() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            liveVideo.srcObject = null;
            liveModal.style.display = 'none';
        }

        // ---------- Send image to Node.js Backend & S3 (unchanged), ----------
        // reported back as a message in the same conversation.
        function uploadImageToServer(fileOrBlob, filename = "capture.jpg") {
            const formData = new FormData();
            formData.append('image', fileOrBlob, filename);

            const uploadingEl = appendMessage('typing', `Uploading ${filename}...`);

            fetch('/upload-image', {
                method: 'POST',
                credentials: 'same-origin', // Crucial: Sends Cognito cookies to backend
                body: formData
            })
            .then(res => {
                if (!res.ok) throw new Error('Upload failed with status ' + res.status);
                return res.json();
            })
            .then(data => {
                uploadingEl.remove();
                appendMessage('bot', "✨ Image uploaded! Ask me anything about it.");
                console.log("S3 Upload Success:", data);
            })
            .catch(err => {
                uploadingEl.remove();
                console.error("Upload error:", err);
                appendMessage('error', 'Error uploading image. Please check your session.');
            });
        }

        // Greet the user on load
        appendMessage('bot', "Hi! Search for a product above, snap a photo, or just ask me anything about your skin or routine.");
    </script>

</body>
</html>
