<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | DermaCare</title>

    <!-- CRITICAL: Apply saved theme instantly before render to prevent flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <style>
        :root {
            --primary-color: #00838f;
            --primary-hover: #006064;
            --text-main: #333333;
            --text-muted: #555555;
            --bg-gradient: linear-gradient(135deg, #e0f7fa, #fce4ec, #e8f5e9, #fff9c4);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-hover-bg: rgba(255, 255, 255, 0.95);
            --header-bg: rgba(255, 255, 255, 0.75);
            --border-color: rgba(255, 255, 255, 0.6);
            --orb-1: rgba(0, 131, 143, 0.3);
            --orb-2: rgba(233, 30, 99, 0.2);
            --heading-color: #1a1a1a;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
        }

        [data-theme="dark"] {
            --primary-color: #4dd0e1;
            --primary-hover: #26c6da;
            --text-main: #f1f3f2;
            --text-muted: #adb5bd;
            --bg-gradient: linear-gradient(135deg, #0f1719, #1f1118, #111a13, #1f1e0f);
            --card-bg: rgba(26, 35, 30, 0.85);
            --card-hover-bg: rgba(30, 42, 36, 0.95);
            --header-bg: rgba(18, 24, 21, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --orb-1: rgba(77, 208, 225, 0.15);
            --orb-2: rgba(233, 30, 99, 0.1);
            --heading-color: #ffffff;
            --input-bg: rgba(18, 24, 21, 0.9);
            --input-border: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* Ambient Glowing Background Orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.65;
            animation: floatOrb 12s ease-in-out infinite alternate;
            transition: background 0.4s ease;
        }

        body::before {
            background: var(--orb-1);
            top: -80px;
            left: -80px;
        }

        body::after {
            background: var(--orb-2);
            bottom: -80px;
            right: -80px;
            animation-delay: -6s;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatOrb {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(40px) scale(1.15) rotate(15deg); }
        }

        /* Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--heading-color);
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo span {
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        .nav-links a:hover {
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        /* Theme Toggle Button Style */
        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .theme-btn:hover {
            transform: scale(1.1) rotate(15deg);
            border-color: var(--primary-color);
            background: var(--card-hover-bg);
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            flex-grow: 1;
            z-index: 1;
        }

        /* Hero Section */
        .contact-hero {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .contact-hero h1 {
            font-size: clamp(2.2rem, 6vw, 3rem);
            font-weight: 800;
            color: var(--heading-color);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            transition: color 0.4s ease;
        }

        .contact-hero p {
            font-size: clamp(1rem, 3vw, 1.15rem);
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            transition: color 0.4s ease;
        }

        /* Text Hover Effect */
        .hover-text-effect {
            transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 0.3s ease;
            cursor: default;
        }

        .hover-text-effect:hover {
            color: var(--primary-color);
            transform: translateY(-2px);
            text-shadow: 0 4px 15px rgba(0, 131, 143, 0.2);
        }

        /* Contact Card Wrapper */
        .contact-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s ease, border-color 0.4s ease;
        }

        .contact-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 22px 45px rgba(0, 131, 143, 0.15);
            background: var(--card-hover-bg);
        }

        /* Form Group Styles */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: color 0.4s ease;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 131, 143, 0.12);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        /* Submit Button */
        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 131, 143, 0.3);
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 131, 143, 0.4);
        }

        .submit-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        #status-message {
            margin-top: 15px;
            font-weight: 500;
            color: var(--primary-color);
            text-align: center;
            min-height: 24px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
            animation: fadeIn 1s ease 0.5s forwards;
            opacity: 0;
            transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
        }

        /* Keyframes */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            header { padding: 15px 20px; }
            .contact-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="home.html" class="logo">Derma<span>Care</span></a>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="aboutus.html">About Us</a>
            <a href="contact.html" style="color: var(--primary-color);">Contact</a>
            <!-- Theme Toggle Button -->
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Night/Day Mode">🌙</button>
        </nav>
    </header>

    <!-- Main Contact Content -->
    <div class="container">
        <section class="contact-hero">
            <h1 class="hover-text-effect">Get in Touch With Us</h1>
            <p class="hover-text-effect">Have questions about our skincare database, feedback, or need assistance? Drop us a message below!</p>
        </section>

        <!-- Contact Form Card -->
        <div class="contact-card">
            <form id="contact-form" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="name">Your Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your name..." required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email..." required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" class="form-control" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
            <div id="status-message"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 DermaCare. All rights reserved.
    </footer>

    <script>
        // Form submission handler
        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const statusMessage = document.getElementById('status-message');
            
            if (name !== "") {
                statusMessage.innerText = `Thank you, ${name}! Your message has been sent successfully.`;
                document.getElementById('contact-form').reset();
            }
        }

        // Night/Day Theme Toggle Setup & Sync
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // Synchronize button icon state on page load based on active theme
        if (htmlElement.getAttribute('data-theme') === 'dark') {
            themeToggleBtn.innerText = '☀️';
        } else {
            themeToggleBtn.innerText = '🌙';
        }

        themeToggleBtn.addEventListener('click', function() {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                this.innerText = '🌙';
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                this.innerText = '☀️';
            }
        });
    </script>

</body>
</html>
