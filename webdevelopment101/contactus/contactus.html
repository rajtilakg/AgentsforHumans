<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | DermaCare</title>
    <style>
        :root {
            --primary-color: #00838f;
            --primary-hover: #006064;
            --text-main: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f7fa, #fce4ec, #e8f5e9, #fff9c4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.65;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        body::before {
            background: rgba(0, 131, 143, 0.3);
            top: -80px;
            left: -80px;
        }

        body::after {
            background: rgba(233, 30, 99, 0.2);
            bottom: -80px;
            right: -80px;
            animation-delay: -6s;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatOrb {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(40px) scale(1.15) rotate(15deg); }
        }

        /* Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a1a1a;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo span {
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        .nav-links a:hover {
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            flex-grow: 1;
            z-index: 1;
        }

        /* Hero Section */
        .contact-hero {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .contact-hero h1 {
            font-size: clamp(2.2rem, 6vw, 3rem);
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .contact-hero p {
            font-size: clamp(1rem, 3vw, 1.15rem);
            color: #555555;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Text Hover Effect */
        .hover-text-effect {
            transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 0.3s ease;
            cursor: default;
        }

        .hover-text-effect:hover {
            color: var(--primary-color);
            transform: translateY(-2px);
            text-shadow: 0 4px 15px rgba(0, 131, 143, 0.2);
        }

        /* Contact Card Wrapper */
        .contact-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .contact-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 22px 45px rgba(0, 131, 143, 0.15);
        }

        /* Form Group Styles */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 131, 143, 0.12);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        /* Submit Button */
        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 131, 143, 0.3);
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 131, 143, 0.4);
        }

        .submit-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        #status-message {
            margin-top: 15px;
            font-weight: 500;
            color: var(--primary-color);
            text-align: center;
            min-height: 24px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            color: #666666;
            animation: fadeIn 1s ease 0.5s forwards;
            opacity: 0;
        }

        /* Keyframes */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            header { padding: 15px 20px; }
            .contact-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="index.html" class="logo">Derma<span>Care</span></a>
        <nav class="nav-links">
            <a href="/webdevelopment101/home.html">Home</a>
            <a href="/webdevelopment101/aboutus.html">About Us</a>
            <a href="contact.html" style="color: var(--primary-color);">Contact</a>
        </nav>
    </header>

    <!-- Main Contact Content -->
    <div class="container">
        <section class="contact-hero">
            <h1 class="hover-text-effect">Get in Touch With Us</h1>
            <p class="hover-text-effect">Have questions about our skincare database, feedback, or need assistance? Drop us a message below!</p>
        </section>

        <!-- Contact Form Card -->
        <div class="contact-card">
            <form id="contact-form" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="name">Your Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your name..." required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email..." required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" class="form-control" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
            <div id="status-message"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 DermaCare. All rights reserved.
    </footer>

    <script>
        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const statusMessage = document.getElementById('status-message');
            
            if (name !== "") {
                statusMessage.innerText = `Thank you, ${name}! Your message has been sent successfully.`;
                document.getElementById('contact-form').reset();
            }
        }
    </script>

</body>
</html>
