<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Search | DermaCare</title>
    <style>
        :root {
            --primary-color: #00838f;
            --primary-hover: #006064;
            --text-main: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: linear-gradient(135deg, #e0f7fa, #fce4ec, #e8f5e9, #fff9c4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient glowing background floating shapes */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: floatOrb 10s ease-in-out infinite alternate;
        }

        body::before {
            background: rgba(0, 131, 143, 0.25);
            top: -50px;
            left: -50px;
        }

        body::after {
            background: rgba(233, 30, 99, 0.15);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatOrb {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(20px) scale(1.1); }
        }

        /* Animated Title Header */
        .header-container {
            text-align: center;
            margin-top: 15px;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 1;
        }

        .animated-title {
            font-size: clamp(2rem, 8vw, 2.4rem);
            font-weight: 800;
            color: #1a1a1a;
            margin: 0;
            letter-spacing: -0.5px;
            display: inline-flex;
            gap: 4px;
        }

        .animated-title span {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: letterEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animated-title span:nth-child(1) { animation-delay: 0.1s; }
        .animated-title span:nth-child(2) { animation-delay: 0.15s; }
        .animated-title span:nth-child(3) { animation-delay: 0.2s; }
        .animated-title span:nth-child(4) { animation-delay: 0.25s; }
        .animated-title span:nth-child(5) { animation-delay: 0.3s; color: var(--primary-color); }
        .animated-title span:nth-child(6) { animation-delay: 0.35s; color: var(--primary-color); }
        .animated-title span:nth-child(7) { animation-delay: 0.4s; color: var(--primary-color); }
        .animated-title span:nth-child(8) { animation-delay: 0.45s; color: var(--primary-color); }
        .animated-title span:nth-child(9) { animation-delay: 0.5s; color: var(--primary-color); }

        .subtitle {
            font-size: clamp(0.85rem, 3.5vw, 0.95rem);
            color: #555555;
            margin-top: 5px;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.6s forwards;
            font-weight: 500;
        }

        /* Pinned Bottom Search Wrapper Card */
        .search-wrapper {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 650px;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            box-sizing: border-box;
            z-index: 1;
            margin-bottom: 10px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Search Wrapper Hover State (Card Pops) */
        .search-wrapper:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 22px 45px rgba(0, 131, 143, 0.15);
        }

        /* Fluid Search Bar */
        .search-bar {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            padding: 4px 10px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            width: 100%;
            box-sizing: border-box;
        }

        /* Pop Effect Class (Triggered on typing or image action via JS) */
        .search-bar.pop-active, .search-bar:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 6px rgba(0, 131, 143, 0.15), 0 10px 25px rgba(0,0,0,0.08);
            transform: scale(1.02);
            background: #ffffff;
        }

        input[type="text"] {
            border: none;
            outline: none;
            flex-grow: 1;
            font-size: 1rem;
            padding: 12px 6px;
            background: transparent;
            color: var(--text-main);
            min-width: 0;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: transform 0.2s ease, color 0.2s ease, background-color 0.2s ease;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-btn:hover {
            color: var(--primary-color);
            background-color: rgba(0, 131, 143, 0.08);
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        #camera-input {
            display: none; 
        }

        #status-message {
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--primary-color);
            min-height: 22px;
            transition: opacity 0.3s ease;
            word-break: break-word;
        }

        /* Live Camera Modal Styles */
        #live-camera-modal {
            display: none;
            opacity: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        #live-video {
            width: 100%;
            max-width: 500px;
            max-height: 70vh;
            object-fit: cover;
            border-radius: 16px;
            border: 3px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #live-camera-modal.active {
            display: flex;
            opacity: 1;
        }

        #live-camera-modal.active #live-video {
            transform: scale(1);
        }

        .modal-controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 131, 143, 0.3);
            -webkit-tap-highlight-color: transparent;
            flex: 1;
            min-width: 130px;
        }

        .modal-btn:active {
            transform: scale(0.96);
        }

        .modal-btn.close {
            background: #d32f2f;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        /* Keyframes */
        @keyframes letterEntrance {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseMessage {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulseMessage 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Animated Title Header -->
    <div class="header-container">
        <h1 class="animated-title">
            <span>D</span><span>e</span><span>r</span><span>m</span><span>a</span><span>C</span><span>a</span><span>r</span><span>e</span>
        </h1>
        <div class="subtitle">Advanced Skincare Intelligence</div>
    </div>

    <!-- Pinned Bottom Search Wrapper -->
    <div class="search-wrapper">
        <div class="search-bar" id="search-bar-container">
            <!-- 1. Text Search Button -->
            <button class="icon-btn" onclick="performTextSearch()" title="Search">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            
            <input type="text" id="search-input" placeholder="Search name, ingredient..." autocomplete="off">
            
            <!-- 2. Snapshot Lens Button -->
            <label for="camera-input" class="icon-btn" title="Search with Photo Lens">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </label>
            <input type="file" id="camera-input" accept="image/*" capture="environment">

            <!-- 3. Live Search Camera Button -->
            <button class="icon-btn" id="live-search-btn" title="Live Camera Search" onclick="startLiveSearch()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 7l-7 5 7 5V7z"></path>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </button>
        </div>

        <div id="status-message"></div>
    </div>

    <!-- Live Camera Stream Overlay/Modal -->
    <div id="live-camera-modal">
        <video id="live-video" autoplay playsinline></video>
        <div class="modal-controls">
            <button class="modal-btn" onclick="captureLiveFrame()">Capture & Search</button>
            <button class="modal-btn close" onclick="stopLiveSearch()">Close Camera</button>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const cameraInput = document.getElementById('camera-input');
        const statusMessage = document.getElementById('status-message');
        const liveModal = document.getElementById('live-camera-modal');
        const liveVideo = document.getElementById('live-video');
        const searchBarContainer = document.getElementById('search-bar-container');
        let mediaStream = null;
        let popTimeout = null;

        // Function to trigger a dynamic temporary pop animation on input/uploads
        function triggerPopEffect() {
            searchBarContainer.classList.add('pop-active');
            clearTimeout(popTimeout);
            // Keep the pop active briefly if typing continues, then gently settle
            popTimeout = setTimeout(() => {
                if (document.activeElement !== searchInput) {
                    searchBarContainer.classList.remove('pop-active');
                }
            }, 1200);
        }

        function triggerPulse() {
            statusMessage.classList.remove('pulse');
            void statusMessage.offsetWidth;
            statusMessage.classList.add('pulse');
        }

        // Text Search & Typing Pop Listener
        searchInput.addEventListener('input', function() {
            triggerPopEffect();
        });

        function performTextSearch() {
            const query = searchInput.value.trim();
            if (query === "") {
                statusMessage.innerText = "Please enter a search term.";
                triggerPulse();
                return;
            }
            statusMessage.innerText = `Searching for: "${query}"...`;
            triggerPulse();
            triggerPopEffect();
        }

        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performTextSearch();
        });

        // Photo Snapshot Lens (Triggers Pop when file is uploaded)
        cameraInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                searchInput.value = '';
                statusMessage.innerText = `Analyzing: ${file.name}...`;
                triggerPulse();
                triggerPopEffect();
            }
        });

        // --- Live Search Camera Functions ---
        async function startLiveSearch() {
            liveModal.classList.add('active');
            statusMessage.innerText = "Initializing live camera...";
            triggerPopEffect();
            
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                liveVideo.srcObject = mediaStream;
            } catch (error) {
                console.error("Camera access denied or unavailable:", error);
                statusMessage.innerText = "Error: Could not access camera.";
                stopLiveSearch();
            }
        }

        function captureLiveFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = liveVideo.videoWidth;
            canvas.height = liveVideo.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(liveVideo, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                stopLiveSearch();
                statusMessage.innerText = "Frame captured! Processing match...";
                triggerPulse();
                triggerPopEffect();
            }, 'image/jpeg');
        }

        function stopLiveSearch() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            liveVideo.srcObject = null;
            liveModal.classList.remove('active');
        }
    </script>

</body>
</html>
