<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Q&A | DermaCare</title>
    <style>
        :root {
            --primary-color: #00838f;
            --primary-hover: #006064;
            --primary-light: #e0f7fa;
            --text-main: #333333;
            --text-muted: #666666;
            --success-color: #2e7d32;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f7fa, #fce4ec, #e8f5e9, #fff9c4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            box-sizing: border-box;
        }

        /* Ambient Glowing Background Orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.65;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        body::before {
            background: rgba(0, 131, 143, 0.3);
            top: -80px;
            left: -80px;
        }

        body::after {
            background: rgba(233, 30, 99, 0.2);
            bottom: -80px;
            right: -80px;
            animation-delay: -6s;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatOrb {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(40px) scale(1.15) rotate(15deg); }
        }

        /* Main Glassmorphic Container */
        .qa-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            box-sizing: border-box;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .qa-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 45px rgba(0, 131, 143, 0.12);
        }

        /* Logo Styling */
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a1a1a;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 25px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo span {
            color: var(--primary-color);
        }

        .progress-text {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .question-box {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Text Hover Animation Effect */
        .hover-text-effect {
            transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 0.3s ease;
            cursor: default;
        }

        .hover-text-effect:hover {
            color: var(--primary-color);
            transform: translateY(-2px);
            text-shadow: 0 4px 15px rgba(0, 131, 143, 0.2);
        }

        h2 {
            font-size: 1.7rem;
            margin-bottom: 25px;
            color: #1a1a1a;
            animation: fadeIn 0.5s ease-in;
        }

        input[type="text"] {
            width: 90%;
            padding: 14px 18px;
            font-size: 1rem;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 30px;
            color: var(--text-main);
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 131, 143, 0.12);
        }

        .btn {
            background: var(--primary-color);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 131, 143, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 131, 143, 0.4);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Animated Notification Popup Banner */
        .notification-banner {
            position: fixed;
            top: 25px;
            right: 25px;
            background: #ffffff;
            border-left: 5px solid var(--primary-color);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .notification-banner.show {
            transform: translateX(0);
        }

        .notification-banner span {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Success screen styling */
        .success-message {
            display: none;
            color: var(--primary-color);
        }
        
        .success-message h2 {
            color: var(--primary-color);
        }

        @media (max-width: 600px) {
            .qa-container {
                padding: 25px;
                margin: 20px;
            }
            .notification-banner {
                left: 20px;
                right: 20px;
                top: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Notification Toast Element -->
    <div id="notification" class="notification-banner">
        <span>🎉 Profile saved successfully! Redirecting...</span>
    </div>

    <div class="qa-container">
        <!-- Logo Added -->
        <a href="#" class="logo">Derma<span>Care</span></a>

        <!-- Interactive Q&A Area -->
        <div id="quiz-area">
            <div class="progress-text" id="progress">Question 1 of 5</div>
            
            <div class="question-box">
                <h2 id="question-text" class="hover-text-effect">Loading question...</h2>
                <input type="text" id="answer-input" placeholder="Type your answer here..." autocomplete="off">
            </div>

            <button class="btn" id="next-btn">Next Question</button>
        </div>

        <!-- Success Area (Hidden until finished) -->
        <div id="success-area" class="success-message">
            <h2 class="hover-text-effect">✨ All Done!</h2>
            <p class="hover-text-effect">Your personalized skin profile has been generated.</p>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 20px;">
                *Syncing your data securely...
            </p>
        </div>
    </div>

    <script>
        const questionPool = [
            "What is your primary skin concern right now?",
            "How would you describe your skin type (e.g., oily, dry, combo)?",
            "Do you experience frequent breakouts or acne?",
            "What does your current morning skincare routine look like?",
            "Are you allergic or sensitive to any specific ingredients?",
            "How often do you apply sunscreen?",
            "Have you ever consulted a dermatologist before?",
            "Does your skin tend to get red or irritated easily?",
            "What are your main goals for your skin?",
            "How much water do you drink on an average day?"
        ];

        let selectedQuestions = [];
        let currentQuestionIndex = 0;
        let userData = {};

        const questionTextElement = document.getElementById('question-text');
        const answerInput = document.getElementById('answer-input');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('progress');
        const quizArea = document.getElementById('quiz-area');
        const successArea = document.getElementById('success-area');
        const notification = document.getElementById('notification');

        function initQuiz() {
            let shuffled = questionPool.sort(() => 0.5 - Math.random());
            selectedQuestions = shuffled.slice(0, 5);
            loadQuestion();
        }

        function loadQuestion() {
            progressText.innerText = `Question ${currentQuestionIndex + 1} of 5`;
            questionTextElement.innerText = selectedQuestions[currentQuestionIndex];
            answerInput.value = '';
            answerInput.focus();

            if (currentQuestionIndex === 4) {
                nextBtn.innerText = "Finish & Save Profile";
            }
        }

        nextBtn.addEventListener('click', () => {
            const answer = answerInput.value.trim();
            
            if (answer === '') {
                // Subtle inline alert style instead of hard interrupt alert if preferred
                answerInput.style.borderColor = '#e91e63';
                setTimeout(() => { answerInput.style.borderColor = '#e0e0e0'; }, 1000);
                return;
            }

            const currentQuestion = selectedQuestions[currentQuestionIndex];
            userData[currentQuestion] = answer;

            currentQuestionIndex++;

            if (currentQuestionIndex < 5) {
                questionTextElement.style.animation = 'none';
                setTimeout(() => {
                    questionTextElement.style.animation = 'fadeIn 0.5s ease-in';
                    loadQuestion();
                }, 10);
            } else {
                finishQuiz();
            }
        });

        answerInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                nextBtn.click();
            }
        });

        function finishQuiz() {
            quizArea.style.display = 'none';
            successArea.style.display = 'block';

            // Trigger the slide-in animation for the notification banner
            notification.classList.add('show');

            const finalDatabaseEntry = {
                timestamp: new Date().toISOString(),
                patientAnswers: userData
            };

            fetch('/save-answers', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(finalDatabaseEntry)
            })
            .then(response => response.json())
            .then(data => {
                console.log("Server response:", data);
            })
            .catch(error => {
                console.error("Error saving data to server:", error);
            });

            // Redirect after 2 seconds to allow the user to read the notification banner
            setTimeout(() => {
                window.location.href = "\\Main.html"; 
            }, 2000);
        }

        initQuiz();
    </script>

</body>
</html>
