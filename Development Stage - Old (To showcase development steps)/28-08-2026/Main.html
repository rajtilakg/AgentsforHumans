<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Search | DermaCare Intelligence</title>
    <link rel="stylesheet" href="Main.css">
    
    <!-- CRITICAL: Apply saved theme instantly before render to prevent flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="home.html" class="logo">Derma<span>Care</span></a>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="Main.html" style="color: var(--primary-color);">Search</a>
            <a href="aboutus.html">About Us</a>
            <!-- Theme Toggle Button -->
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Night/Day Mode">🌙</button>
        </nav>
    </header>

    <div class="app-container">
        <!-- Header -->
        <div class="header-container">
            <h1 class="animated-title">
                <span>D</span><span>e</span><span>r</span><span>m</span><span>a</span><span>C</span><span>a</span><span>r</span><span>e</span>
            </h1>
            <div class="subtitle">Advanced Skincare Intelligence powered by Gemini</div>
        </div>

        <!-- Scrollable Results Panel (Shows results above the bottom search) -->
        <div id="results-container">
            <div class="result-card" id="initial-placeholder">
                Search for an active ingredient, skin condition, or upload a product snapshot to begin intelligent skincare analysis.
            </div>
        </div>

        <!-- Sticky Pinned Bottom Search Wrapper -->
        <div class="search-wrapper">
            <div class="search-bar" id="search-bar-container">
                <!-- 1. Text Search Button -->
                <button class="icon-btn" onclick="performTextSearch()" title="Search">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                
                <input type="text" id="search-input" placeholder="Ask follow-up or search ingredient..." autocomplete="off">
                
                <!-- 2. Snapshot Lens Button -->
                <label for="camera-input" class="icon-btn" title="Search with Photo Lens">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </label>
                <input type="file" id="camera-input" accept="image/*" capture="environment">

                <!-- 3. Live Search Camera Button -->
                <button class="icon-btn" id="live-search-btn" title="Live Camera Search" onclick="startLiveSearch()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 7l-7 5 7 5V7z"></path>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </button>
            </div>
            <div id="status-message"></div>
        </div>
    </div>

    <!-- Live Camera Stream Overlay/Modal -->
    <div id="live-camera-modal">
        <video id="live-video" autoplay playsinline></video>
        <div class="modal-controls">
            <button class="modal-btn" onclick="captureLiveFrame()">Capture & Search</button>
            <button class="modal-btn close" onclick="stopLiveSearch()">Close Camera</button>
        </div>
    </div>

    <script>
        // Night/Day Theme Toggle Setup & Sync
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // Synchronize button icon state on page load based on active theme
        if (htmlElement.getAttribute('data-theme') === 'dark') {
            themeToggleBtn.innerText = '☀️';
        } else {
            themeToggleBtn.innerText = '🌙';
        }

        themeToggleBtn.addEventListener('click', function() {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                this.innerText = '🌙';
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                this.innerText = '☀️';
            }
        });

        // Search App Logic
        const searchInput = document.getElementById('search-input');
        const cameraInput = document.getElementById('camera-input');
        const statusMessage = document.getElementById('status-message');
        const resultsContainer = document.getElementById('results-container');
        const liveModal = document.getElementById('live-camera-modal');
        const liveVideo = document.getElementById('live-video');
        const searchBarContainer = document.getElementById('search-bar-container');
        let mediaStream = null;

        async function displayResult(queryText, responseHTML) {
            resultsContainer.style.display = 'block';
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `<strong>Q: ${escapeHtml(queryText)}</strong><br>${responseHTML}`;
            resultsContainer.appendChild(card);
            resultsContainer.scrollTop = resultsContainer.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function callGeminiAPI(prompt, imageBase64 = null) {
            statusMessage.innerText = "Analyzing with Gemini intelligence...";
            searchBarContainer.classList.add('pop-active');

            try {
                await new Promise(resolve => setTimeout(resolve, 1000));
                return `Gemini analysis complete for <em>"${escapeHtml(prompt)}"</em>. This compound works well for boosting skin barrier protection. Feel free to ask a follow-up related topic below!`;
            } catch (error) {
                console.error("Gemini API Error:", error);
                return "Sorry, we encountered an issue communicating with the AI service.";
            } finally {
                statusMessage.innerText = "";
                searchBarContainer.classList.remove('pop-active');
            }
        }

        async function performTextSearch() {
            const query = searchInput.value.trim();
            if (query === "") {
                statusMessage.innerText = "Please enter a search term.";
                return;
            }
            searchInput.value = '';
            const aiResponse = await callGeminiAPI(query);
            await displayResult(query, aiResponse);
        }

        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performTextSearch();
        });

        cameraInput.addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64Data = e.target.result.split(',')[1];
                    const aiResponse = await callGeminiAPI("Photo Analysis: " + file.name, base64Data);
                    await displayResult("Photo Analysis (" + file.name + ")", aiResponse);
                };
                reader.readAsDataURL(file);
            }
        });

        async function startLiveSearch() {
            liveModal.classList.add('active');
            statusMessage.innerText = "Initializing live camera...";
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                liveVideo.srcObject = mediaStream;
            } catch (error) {
                console.error("Camera access denied:", error);
                statusMessage.innerText = "Error: Could not access camera.";
                stopLiveSearch();
            }
        }

        async function captureLiveFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = liveVideo.videoWidth || 640;
            canvas.height = liveVideo.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(liveVideo, 0, 0, canvas.width, canvas.height);
            
            const base64Data = canvas.toDataURL('image/jpeg').split(',')[1];
            stopLiveSearch();

            const aiResponse = await callGeminiAPI("Live Camera Frame Analysis", base64Data);
            await displayResult("Live Camera Snapshot", aiResponse);
        }

        function stopLiveSearch() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            liveVideo.srcObject = null;
            liveModal.classList.remove('active');
            statusMessage.innerText = "";
        }
    </script>
</body>
</html>
